<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy GIS Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">

<!-- 外部ライブラリのバージョンはここで一括管理する -->
<script type="importmap">
{
  "imports": {
    "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
    "chroma-js": "https://cdn.jsdelivr.net/npm/chroma-js@2.4.2/+esm",
    "sortablejs": "https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/+esm"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>

<header id="header">
  <button id="sidebarToggle" class="icon-btn header-btn" type="button" aria-label="レイヤパネルを開閉" title="レイヤパネルを開閉">☰</button>
  <h1>Easy GIS Viewer</h1>
</header>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-actions">
      <button id="addFileBtn" class="btn-primary" type="button">＋ ファイルを追加</button>
      <input id="fileInput" type="file" multiple hidden>
      <p class="hint">GeoJSONファイルを地図にドラッグ＆ドロップしても追加できます</p>
    </div>
    <div id="layerList"></div>
    <p id="emptyMessage" class="empty-message">まだレイヤがありません</p>
  </aside>
  <main id="map"></main>
</div>

<div id="dropOverlay" hidden><div>ここにドロップして追加</div></div>
<div id="toastArea" aria-live="polite"></div>

</body>
</html>
